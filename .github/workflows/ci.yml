name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Allow workflow to create releases
permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake scons git python3 python3-pip pkg-config

      - name: Make build script executable
        run: chmod +x script/build.sh

      - name: Run build script (fast)
        env:
          # Limit parallelism to avoid heavy CI usage; override in local runs
          SCONSFLAGS: -j2
        run: |
          # init submodules
          git submodule update --init --recursive
          # run build script; it will stop on error
          ./script/build.sh

      - name: Upload addons artifact (linux)
        uses: actions/upload-artifact@v4
        with:
          name: addons-linux
          path: addons/

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install scons
        shell: bash

      - name: Run Windows build script
        run: cmd /c script\build.bat
      - name: Upload addons artifact (windows)
        uses: actions/upload-artifact@v4
        with:
          name: addons-windows
          path: addons\\

  package:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download linux artifact
        uses: actions/download-artifact@v4
        with:
          name: addons-linux
          path: artifacts/linux

      - name: Download windows artifact
        uses: actions/download-artifact@v4
        with:
          name: addons-windows
          path: artifacts/windows

      - name: Merge artifacts (windows overwrites linux)
        run: |
          mkdir -p merged
          # copy linux first
          if [ -d "artifacts/linux/addons" ]; then
            cp -a artifacts/linux/addons/. merged/
          fi
          # then copy windows to overwrite
          if [ -d "artifacts/windows/addons" ]; then
            cp -a artifacts/windows/addons/. merged/
          fi

      - name: Create archives
        run: |
          TIMESTAMP=${{ github.run_id }}
          zip -r addons-${TIMESTAMP}.zip merged || true
          tar -czf addons-${TIMESTAMP}.tar.gz merged || true

      - name: Create GitHub release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: build-${{ github.run_id }}
          release_name: build-${{ github.run_id }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload zip asset
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: addons-${{ github.run_id }}.zip
          asset_name: addons-${{ github.run_id }}.zip
          asset_content_type: application/zip

      - name: Upload tar.gz asset
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: addons-${{ github.run_id }}.tar.gz
          asset_name: addons-${{ github.run_id }}.tar.gz
          asset_content_type: application/gzip
