name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache godot-cpp build
        uses: actions/cache@v4
        with:
          path: |
            godot-cpp/bin
            godot-cpp/include
            godot-cpp/.sconsign.dblite
          key: ${{ runner.os }}-godot-cpp-${{ hashFiles('godot-cpp/SConstruct') }}
          restore-keys: |
            ${{ runner.os }}-godot-cpp-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake scons git python3 python3-pip pkg-config

      - name: Make build script executable
        run: chmod +x script/build.sh

      - name: Run build script (fast)
        run: |
          git submodule update --init --recursive
          SCONSFLAGS=-j$(nproc) ./script/build.sh

      - name: Upload addons artifact (linux)
        uses: actions/upload-artifact@v4
        with:
          name: addons-linux
          path: addons/

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache godot-cpp build (windows)
        uses: actions/cache@v4
        with:
          path: |
            godot-cpp\\bin
            godot-cpp\\include
            godot-cpp\\.sconsign.dblite
          key: ${{ runner.os }}-godot-cpp-${{ hashFiles('godot-cpp/SConstruct') }}
          restore-keys: |
            ${{ runner.os }}-godot-cpp-

      - name: Install Python + SCons
        run: |
          python -m pip install --upgrade pip
          pip install scons

      - name: Run Windows build script
        run: cmd /c script\build.bat
        shell: cmd

      - name: Upload addons artifact (windows)
        uses: actions/upload-artifact@v4
        with:
          name: addons-windows
          path: addons\\

  package:
    if: github.event_name == 'push'
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Download linux artifact
        uses: actions/download-artifact@v4
        with:
          name: addons-linux
          path: artifacts/linux

      - name: Download windows artifact
        uses: actions/download-artifact@v4
        with:
          name: addons-windows
          path: artifacts/windows

      - name: Merge artifacts (windows overwrites linux)
        run: |
          mkdir -p merged
          if [ -d "artifacts/linux" ]; then
            cp -a artifacts/linux/. merged/ || true
          fi
          if [ -d "artifacts/windows" ]; then
            cp -a artifacts/windows/. merged/ || true
          fi

      - name: Create archives
        run: |
          TIMESTAMP=${{ github.run_id }}
          zip -r addons-${TIMESTAMP}.zip merged
          tar -czf addons-${TIMESTAMP}.tar.gz merged

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_id }}
          name: build-${{ github.run_id }}
          files: |
            addons-${{ github.run_id }}.zip
            addons-${{ github.run_id }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}